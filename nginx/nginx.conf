events {
    worker_connections 1024;
}

http {
    upstream web {
        server web:80;
    }

    upstream auth_service {
        server auth_service:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Trust headers from the first Nginx proxy
        set_real_ip_from 0.0.0.0/0; # Or your first Nginx's IP
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Important headers to pass through from the first Nginx
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_set_header X-Forwarded-Host $host;

        error_log /var/log/nginx/error.log debug;
        access_log /var/log/nginx/access.log;

        location = /auth {
            proxy_pass http://auth_service/verify-token?$args;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; # Pass through
            proxy_connect_timeout 10s;
            proxy_read_timeout 10s;
        }

        location = /unauthorized {
            return 401 "Authentication required";
        }

        location /view {
            auth_request /auth;
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; # Pass through
            proxy_set_header X-CSRFToken $http_x_csrf_token;
            proxy_cookie_path / "/; secure; HttpOnly; SameSite=strict";
            error_page 401 403 =401 /unauthorized;
        }

        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; # Pass through
            proxy_set_header X-CSRFToken $http_x_csrf_token;
            proxy_cookie_path / "/; secure; HttpOnly; SameSite=strict";
            
            # Add Content-Security-Policy if you're having mixed content issues
            add_header Content-Security-Policy "upgrade-insecure-requests";
        }
    }
}
